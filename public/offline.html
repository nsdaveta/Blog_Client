<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Blogify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c63ff;
            --primary-hover: #4e47cc;
            --bg-color: #0d1117;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --card-bg: rgba(22, 27, 34, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 25s infinite ease-in-out alternate;
            z-index: 0;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #6c63ff;
            top: -150px;
            left: -100px;
        }

        .orb-2 {
            width: 550px;
            height: 550px;
            background: #238636;
            bottom: -250px;
            right: -150px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: #f85149;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -12s;
            opacity: 0.3;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(40px, -60px) scale(1.1);
            }

            66% {
                transform: translate(-30px, 30px) scale(0.9);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        /* Glassmorphism Container */
        .container {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 4rem 2.5rem;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* App Identity Footer/Header */
        .app-name {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        /* Floating Icon */
        .icon-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 2.5rem;
            background: radial-gradient(circle at center, rgba(108, 99, 255, 0.15), transparent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: bob 4s ease-in-out infinite;
            position: relative;
        }

        .icon-container::after {
            content: '';
            position: absolute;
            width: 140%;
            height: 140%;
            border-radius: 50%;
            border: 1px solid rgba(108, 99, 255, 0.1);
            animation: pulse 4s ease-out infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }

            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .main-icon {
            width: 60px;
            height: 60px;
            stroke: #6c63ff;
            filter: drop-shadow(0 0 12px rgba(108, 99, 255, 0.5));
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1.25rem;
            background: linear-gradient(135deg, #ffffff 30%, #6c63ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        p strong {
            color: var(--text-main);
            font-weight: 500;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            padding: 1rem 3rem;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px -10px rgba(108, 99, 255, 0.5);
            gap: 12px;
            outline: none;
        }

        .btn:hover {
            transform: scale(1.05) translateY(-5px);
            background: var(--primary-hover);
            box-shadow: 0 20px 40px -10px rgba(108, 99, 255, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .refresh-icon {
            width: 22px;
            height: 22px;
            transition: transform 0.6s ease;
            stroke: white;
        }

        .btn:hover .refresh-icon {
            transform: rotate(360deg);
        }

        @keyframes infiniteSpin {
            100% {
                transform: rotate(360deg);
            }
        }

        .wifi-line {
            opacity: 0.3;
        }

        .wifi-cross {
            stroke: #f85149;
            stroke-width: 2;
            filter: drop-shadow(0 0 4px #f85149);
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="app-name">Blogify</div>
        <div class="icon-container">
            <svg class="main-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0" class="wifi-line"></path>
                <path d="M1.42 9a16 16 0 0 1 21.16 0" class="wifi-line"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
                <line x1="2" y1="2" x2="22" y2="22" class="wifi-cross"></line>
            </svg>
        </div>
        <h1>Connection Lost</h1>
        <p>Your creative flow has been interrupted.<br /><strong>Check your network to resume publishing.</strong></p>
        <button onclick="retryConnection(event)" class="btn">
            <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Re-Connect
        </button>
    </div>

    <script>
        // Shared robust connectivity check logic
        async function checkActualConnectivity() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                
                await fetch('https://blog-server-7c1i.onrender.com/blog', { 
                    method: 'HEAD', 
                    mode: 'no-cors', 
                    cache: 'no-store',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                return true;
            } catch (e) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000);
                    await fetch('https://www.google.com/favicon.ico', { 
                        method: 'HEAD', 
                        mode: 'no-cors', 
                        cache: 'no-store',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    return true;
                } catch (e2) {
                    return false;
                }
            }
        }

        async function retryConnection(e) {
            e.preventDefault();
            const btn = e.currentTarget;
            const icon = btn.querySelector('.refresh-icon');

            if (btn.disabled) return;
            btn.disabled = true;

            const originalHTML = btn.innerHTML;
            icon.style.transition = 'none';
            icon.style.animation = 'infiniteSpin 1s linear infinite';
            btn.innerHTML = icon.outerHTML + " Re-connecting...";

            const isOnline = await checkActualConnectivity();
            
            if (isOnline) {
                window.location.href = '/';
            } else {
                setTimeout(() => {
                    btn.disabled = false;
                    icon.style.animation = '';
                    btn.innerHTML = originalHTML;

                    btn.style.animation = 'none';
                    setTimeout(() => {
                        btn.style.animation = 'shake 0.4s ease';
                    }, 10);
                }, 800);
            }
        }

        // Auto-reconnect
        window.addEventListener('online', async () => {
            const isOnline = await checkActualConnectivity();
            if (isOnline) window.location.href = '/';
        });

        // Background check
        setInterval(async () => {
            if (navigator.onLine) {
                const isOnline = await checkActualConnectivity();
                if (isOnline) window.location.href = '/';
            }
        }, 5000);

        // CSS Shake animation inject
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                75% { transform: translateX(8px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
